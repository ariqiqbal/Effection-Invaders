name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only reads the code.
permissions:
  contents: read

# "shell: bash" adds -o pipefail, so "script | tee log" fails when the
# script fails. Without it the tee exit code (0) hides failed tests and
# a failed complexity check.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -Xlint:all -d bin $(find src -name '*.java')

      - name: Check resources referenced by code exist
        run: test -f res/graphics && test -f res/scores

  # Runs the game for a few seconds on a virtual display and fails if it
  # throws. Compiling is not enough: a missing font made the game die on the
  # first frame while the window stayed open, which looked like a white screen
  # and passed the compile check. Process "still alive" is not a pass either,
  # because Swing keeps the window open after the main thread dies, so the
  # verdict comes from the log.
  #
  # CI has no res/font.ttf (it is gitignored), so this also covers a fresh
  # clone or an IDE that does not put res on the classpath.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -d bin $(find src -name '*.java')

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Run the game for 10 seconds
        run: xvfb-run -a timeout 10 java -cp bin:res engine.Core > game.log 2>&1 || true

      - name: Check the log
        run: |
          cat game.log
          if grep -q "Exception" game.log; then
            echo "::error::The game threw an exception while starting. See the log above."
            exit 1
          fi
          # First launch (no save.txt) opens the player profile screen (VFX-98)
          # instead of the title screen. Both mean the game started.
          if ! grep -qE "title screen|player profile screen" game.log; then
            echo "::error::The game never reached the title or profile screen."
            exit 1
          fi
          echo "Reached the title screen with no exceptions."

  # Unit tests (JUnit 4) with code coverage (JaCoCo): the same script as on a
  # laptop. Fails if a test fails. The HTML coverage report is attached to the
  # run as the artifact "coverage-report". WBS 2.3.4 / 2.4.1.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache test tools
        uses: actions/cache@v4
        with:
          path: |
            lib/junit-*.jar
            lib/hamcrest-*.jar
            lib/jacoco*.jar
          key: test-tools-${{ hashFiles('scripts/test.sh') }}

      - name: Run tests with coverage
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: bash scripts/test.sh | tee test.log

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit tests"
            grep -E "^OK|^Tests run|FAILURES" test.log || echo "No test result (see log)"
            echo
            grep "Line coverage" test.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          if-no-files-found: ignore

  # Cyclomatic complexity (PMD): lists every method with CC > 10 and fails if
  # one is above MAX_CC in scripts/complexity-check.sh. WBS 2.3.1 / 2.4.1.
  complexity:
    runs-on: ubuntu-latest
    env:
      PMD_VERSION: 7.29.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache PMD
        id: pmd-cache
        uses: actions/cache@v4
        with:
          path: lib/pmd-bin-${{ env.PMD_VERSION }}
          key: pmd-${{ env.PMD_VERSION }}

      - name: Download PMD
        if: steps.pmd-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p lib
          curl -fsSL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          unzip -q pmd.zip -d lib
          rm pmd.zip

      - name: Install column (used by the script for the table)
        run: command -v column || (sudo apt-get update -q && sudo apt-get install -y -q bsdextrautils)

      - name: Check complexity
        run: bash scripts/complexity-check.sh | tee complexity.log

      - name: Complexity summary
        if: always()
        run: |
          {
            echo "## Cyclomatic complexity"
            echo '```'
            grep -v "^\[" complexity.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: reports/complexity.csv
          if-no-files-found: ignore
